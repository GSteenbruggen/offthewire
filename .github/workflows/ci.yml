# Test on both supported platforms, then produce the Linux build.
#
# The runners are the project's only Mac/Linux hardware, so this workflow is
# not a formality: for every platform except Windows it is the build machine.
# PyInstaller cannot cross-compile, which is why the Linux tarball comes from
# ubuntu-latest and the Windows installer is built locally with Inno Setup.

name: CI

# The default workflow token is read-only; attaching a release asset needs
# write. Granted at the top and consumed only by the release step.
permissions:
  contents: write

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  # The suites print box-drawing and marker glyphs; the Windows runner pipes
  # stdout through cp1252 without this and dies on the first ⏺.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run test suites
        # bash on both runners (git-bash on Windows): set -e makes the first
        # failing suite fail the job instead of being masked by later ones.
        shell: bash
        run: |
          set -e
          for t in test_images test_accounting test_repl_input test_environment test_ask test_websearch test_interrupt test_tools test_models test_docs verify_offline; do
            echo "===== $t ====="
            python scripts/$t.py
          done

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller
      - name: Build
        working-directory: installer
        run: python -m PyInstaller --noconfirm OffTheWire.spec
      - name: Smoke test
        # An app that cannot start is not worth shipping; --help exercises the
        # whole import graph without needing Ollama.
        run: installer/dist/OffTheWire/OffTheWire --help
      - name: Package
        run: |
          VERSION=$(grep -oE 'AppVersion +"[0-9.]+"' installer/OffTheWire.iss | grep -oE '[0-9.]+')
          tar -czf "OffTheWire-${VERSION}-linux-x86_64.tar.gz" \
              -C installer/dist OffTheWire
          echo "TARBALL=OffTheWire-${VERSION}-linux-x86_64.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ env.TARBALL }}
      - name: Attach to release
        # Only when the push is a version tag: the tarball joins the Windows
        # installer on the release page.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$TARBALL" --clobber

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller
      - name: Build
        working-directory: installer
        run: python -m PyInstaller --noconfirm OffTheWire.spec
      - name: Smoke test
        run: installer/dist/OffTheWire/OffTheWire --help
      - name: Package
        run: |
          VERSION=$(grep -oE 'AppVersion +"[0-9.]+"' installer/OffTheWire.iss | grep -oE '[0-9.]+')
          tar -czf "OffTheWire-${VERSION}-macos-arm64.tar.gz"               -C installer/dist OffTheWire
          echo "TARBALL=OffTheWire-${VERSION}-macos-arm64.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ env.TARBALL }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$TARBALL" --clobber

  # A real agent turn against a real Ollama with a small model -- the only
  # place the full loop (capability probe, system prompt, generation) runs on
  # Linux and macOS at all. Master pushes only: model downloads are the
  # flakiest step in this file, and a registry hiccup must not block a
  # release tag whose code already passed this job on the same commit.
  e2e:
    needs: test
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install Ollama
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install --quiet ollama
          else
            curl -fsSL https://ollama.com/install.sh | sh
          fi
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-0.6b-${{ runner.os }}
      - name: Start Ollama and pull a small tool-capable model
        shell: bash
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3:0.6b
      - name: Run one real agent turn
        shell: bash
        run: |
          python src/agent.py . --model qwen3:0.6b --think never --yes             --max-steps 3 --prompt "Reply with exactly the single word: pong"             | tee turn.log
          grep -qi "pong" turn.log
